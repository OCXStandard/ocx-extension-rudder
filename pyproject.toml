[project]
name = "ocx-rudder"
version = "1.2.0"
description = "Python data-bindings for the OCX rudder extension schema."
authors = [{ name = "ocastrup", email = "ole.christain.astrup@dnv.com" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "xsdata[cli,lxml]>=23.6",
    "packaging>=23.1",
]

[project.urls]
"Homepage" = "https://github.com/OCXStandard/ocx-extension-rudder"
"Bug Tracker" = "https://github.com/OCXStandard/ocx-extension-rudder/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "tbump>=6.11",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ocx_rudder"
module-root = ""

[tool.tbump]
github_url = "https://github.com/OCXStandard/ocx-extension-rudder"

[tool.tbump.version]
current = "1.2.0"

regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  (\-
    (?P<extra>.+)
  )?
  '''

[[tool.tbump.field]]
name = "extra"
default = ""

[tool.tbump.git]
message_template = "Bump to {new_version}"
tag_template = "v{new_version}"

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'version = "{current_version}"'

[[tool.tbump.file]]
src = "ocx_rudder/__init__.py"

[[tool.tbump.file]]
src = "OCX_ext_rudder.xsd"
search = 'fixed="{current_version}"'

[[tool.tbump.file]]
src = "OCX_ext_rudder.xsd"
version_template = "{major}{minor}{patch}{extra}"
search = 'rudder/V{current_version}'

# tbump runs each command without a shell, so commands must not rely on `cd`.
[[tool.tbump.before_commit]]
name = "Insert new xsdata package name"
cmd = "uv run python xsdata_package.py {new_version}"

[[tool.tbump.before_commit]]
name = "Generate data-bindings"
cmd = "uv run xsdata generate OCX_ext_rudder.xsd --config ocx_rudder/.xsdata.xml"

[[tool.tbump.before_commit]]
name = "Insert version string in databinding"
cmd = "uv run python insert_version.py {new_version}"

[[tool.tbump.before_commit]]
name = "Add generated files to commit"
cmd = "git add ocx_rudder"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

